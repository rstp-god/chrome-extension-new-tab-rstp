name: '✨ Предложение фичи'
description: 'Предложить улучшение существующего функционала'
title: '[FEATURE]: '
labels: ['enhancement', 'needs-triage']
body:
  - type: markdown
    attributes:
      value: |
        Опишите проблему пользователя и ваше предложение по улучшению.

  - type: textarea
    id: problem
    attributes:
      label: Какую проблему вы решаете?
      placeholder: Например, "Сейчас нельзя быстро скрывать несколько виджетов".
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Предлагаемое решение
      placeholder: Опишите, как это должно работать.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Альтернативы
      description: Рассматривали ли вы другие варианты?
    validations:
      required: false

  - type: dropdown
    id: impact
    attributes:
      label: Ожидаемый эффект
      options:
        - Небольшое UX-улучшение
        - Среднее улучшение
        - Существенное изменение сценария использования
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Дополнительный контекст
      description: Макеты, ссылки, примеры использования.
    validations:
      required: false
