name: '✨ Feature request'
description: 'Suggest an improvement to existing functionality'
title: '[FEATURE]: '
labels: ['enhancement', 'needs-triage']
body:
  - type: markdown
    attributes:
      value: |
        Describe the user problem and your proposed improvement.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      placeholder: e.g. "It's hard to quickly hide multiple widgets".
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      placeholder: Describe how this should work.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Have you considered other approaches?
    validations:
      required: false

  - type: dropdown
    id: impact
    attributes:
      label: Expected impact
      options:
        - Small UX improvement
        - Medium improvement
        - Significant workflow change
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, links, use cases.
    validations:
      required: false
