name: Update Visual Snapshots

on:
  workflow_dispatch:

jobs:
  update-visual-snapshots:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build extension
        run: yarn build

      - name: Regenerate CI visual snapshots
        run: yarn test:extension:update-snapshots:ci

      - name: Collect CI visual snapshots
        run: |
          mkdir -p snapshot-artifacts/tests/extension
          mkdir -p snapshot-artifacts/src/widgets/ChromeLibrary/test
          mkdir -p snapshot-artifacts/src/widgets/Search/test
          mkdir -p snapshot-artifacts/src/widgets/Todo/test
          mkdir -p snapshot-artifacts/src/widgets/ScreenTime/test
          mkdir -p snapshot-artifacts/src/widgets/TabStats/test
          cp -R tests/extension/chromium-ci snapshot-artifacts/tests/extension/chromium-ci
          cp -R src/widgets/ChromeLibrary/test/chromium-ci snapshot-artifacts/src/widgets/ChromeLibrary/test/chromium-ci
          cp -R src/widgets/Search/test/chromium-ci snapshot-artifacts/src/widgets/Search/test/chromium-ci
          cp -R src/widgets/Todo/test/chromium-ci snapshot-artifacts/src/widgets/Todo/test/chromium-ci
          cp -R src/widgets/ScreenTime/test/chromium-ci snapshot-artifacts/src/widgets/ScreenTime/test/chromium-ci
          cp -R src/widgets/TabStats/test/chromium-ci snapshot-artifacts/src/widgets/TabStats/test/chromium-ci

      - name: Upload CI visual snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-snapshots-ci
          path: snapshot-artifacts
          if-no-files-found: ignore

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-update-snapshots
          path: playwright-report
          if-no-files-found: ignore

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-update-snapshots
          path: test-results
          if-no-files-found: ignore
