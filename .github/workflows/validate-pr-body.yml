name: Validate PR body

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Validate PR description
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || "";

            const templates = {
              en: [
                "## Summary",
                "## Why",
                "## Changes",
                "## Testing",
                "## Checklist"
              ],
              ru: [
                "## Кратко",
                "## Почему",
                "## Изменения",
                "## Тестирование",
                "## Чеклист"
              ]
            };

            const missingByTemplate = Object.fromEntries(
              Object.entries(templates).map(([lang, sections]) => [
                lang,
                sections.filter(section => !body.includes(section))
              ])
            );

            const matchesTemplate = Object.values(missingByTemplate).some(missing => missing.length === 0);

            const stripped = body
              .replace(/<!--[\s\S]*?-->/g, "")
              .replace(/\s+/g, " ")
              .trim();

            const isTooShort = stripped.length < 80;

            if (!matchesTemplate || isTooShort) {
              const details = [];

              if (!matchesTemplate) {
                details.push(
                  "PR description must match either EN or RU template structure.",
                  `Missing (EN): ${missingByTemplate.en.join(", ") || "none"}`,
                  `Missing (RU): ${missingByTemplate.ru.join(", ") || "none"}`
                );
              }

              if (isTooShort) {
                details.push("Description is too short. Fill the template properly.");
              }

              core.setFailed(["PR description is invalid.", ...details].join("\n"));
            }
